[package]
name = "optra"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.16"
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.36.1"
nokhwa = { version = "0.10.11", features = ["input-msmf"] }
ort = { version = "2.0.0-rc.13", features = ["directml"] }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_DirectShow", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
