[package]
name = "optra"
version = "0.1.0"
edition = "2024"
description = "Multi-webcam lower-body tracking for VRChat and SteamVR"
license = "Apache-2.0"
repository = "https://github.com/uthree/optra"

[profile.release]
# The hot path runs per camera per frame and the solve runs Levenberg-Marquardt
# over a few hundred sightings, so the codegen settings are worth their build
# time here.
lto = "thin"
codegen-units = 1

# Deliberately left as unwind. The supervisor catches a worker thread's panic,
# names the thread and puts the message in front of the user; `panic = "abort"`
# would trade that for a process that vanishes mid-session with nothing written
# down. Symbols are kept for the same reason.
panic = "unwind"
strip = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crossbeam-channel = "0.5.16"
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.36.1"
flate2 = "1.1.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libloading = "0.9.0"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
nokhwa = { version = "0.10.11", features = ["input-msmf"] }
ort = { version = "2.0.0-rc.13", features = ["directml"] }
parking_lot = "0.12.5"
rosc = "0.11.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = "3.4.0"
zip = "8.6.0"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media", "Win32_Media_DirectShow", "Win32_Media_MediaFoundation", "Win32_System_Com"] }
